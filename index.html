<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lineage Launcher</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-family: sans-serif;
      background: #0f0f0f;
      color: #888;
      text-align: center;
      padding: 24px;
    }
    .icon { font-size: 40px; }
    h2 { font-size: 16px; color: #ccc; font-weight: 500; }
    p { font-size: 13px; line-height: 1.6; max-width: 320px; }
  </style>
</head>
<body>
  <div class="icon">🔒</div>
  <h2>Root access required</h2>
  <p>Enable <strong>Developer Mode</strong> and <strong>Root Access</strong> in Settings, then relaunch this app.</p>
</body>
</html>
