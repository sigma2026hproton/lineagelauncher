<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <!-- Background circle: semi-transparent dark grey -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3a3a3a" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#1a1a1a" stop-opacity="0.72"/>
    </radialGradient>
    <!-- Green accent gradient for active tiles -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66bb6a"/>
      <stop offset="100%" stop-color="#388e3c"/>
    </linearGradient>
    <!-- Subtle highlight on circle rim -->
    <filter id="rimLight" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer circle — transparent dark bg -->
  <circle cx="48" cy="48" r="46" fill="url(#bgGrad)" stroke="#4caf50" stroke-width="1.2" stroke-opacity="0.55"/>

  <!-- App grid — 3×3, top-left 4 tiles green (active apps), rest grey -->
  <!-- Row 1 -->
  <rect x="18" y="18" width="16" height="16" rx="3.5" fill="url(#greenGrad)" opacity="0.95"/>
  <rect x="40" y="18" width="16" height="16" rx="3.5" fill="url(#greenGrad)" opacity="0.95"/>
  <rect x="62" y="18" width="16" height="16" rx="3.5" fill="#616161" opacity="0.65"/>

  <!-- Row 2 -->
  <rect x="18" y="40" width="16" height="16" rx="3.5" fill="url(#greenGrad)" opacity="0.95"/>
  <rect x="40" y="40" width="16" height="16" rx="3.5" fill="#616161" opacity="0.65"/>
  <rect x="62" y="40" width="16" height="16" rx="3.5" fill="#616161" opacity="0.50"/>

  <!-- Row 3 — dock-style: single wide bar + small tile -->
  <rect x="18" y="62" width="38" height="16" rx="3.5" fill="#424242" opacity="0.70"/>
  <rect x="62" y="62" width="16" height="16" rx="3.5" fill="#388e3c" opacity="0.55"/>

  <!-- Tiny inner icons on green tiles (white dots to suggest app content) -->
  <circle cx="26" cy="26" r="2.5" fill="#fff" opacity="0.55"/>
  <circle cx="48" cy="26" r="2.5" fill="#fff" opacity="0.55"/>
  <circle cx="26" cy="48" r="2.5" fill="#fff" opacity="0.55"/>

  <!-- Dock grip lines on wide bar -->
  <line x1="27" y1="70" x2="47" y2="70" stroke="#9e9e9e" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
  <line x1="27" y1="73.5" x2="47" y2="73.5" stroke="#9e9e9e" stroke-width="1.4" stroke-linecap="round" opacity="0.35"/>
</svg>
